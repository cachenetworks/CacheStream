services:
  # ---------------------------------------------------------
  # Next.js control panel + scene host (port 7788 → Cloudflare
  # Tunnel). Stateless except for the shared data + audio
  # volumes.
  # ---------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: cachestream-web:latest
    container_name: cachestream-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-7788}
      HOSTNAME: 0.0.0.0
    ports:
      # Security-first: the control/setup surface is host-local by default.
      # A deliberately configured Cloudflare Tunnel/reverse proxy can still
      # publish it without exposing first-run setup directly on the LAN/WAN.
      - "127.0.0.1:${WEB_PORT:-7788}:${WEB_PORT:-7788}"
    volumes:
      - cachestream-data:/app/data           # SQLite DB + cover art
      - ./media/music:/app/media/music       # music library (read-write for uploads)
      - ./media/vods:/app/media/vods         # VOD video files (read-write for uploads)
      - cachestream-audio:/app/audio         # FIFO shared with streamer
    depends_on:
      - streamer
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${WEB_PORT:-7788}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------
  # Headless Chromium + FFmpeg worker. Internal-only; not
  # published to the host. Reachable as http://streamer:7789
  # from the web container over the compose network.
  # ---------------------------------------------------------
  streamer:
    build:
      context: ./apps/streamer
      dockerfile: Dockerfile
    image: cachestream-streamer:latest
    container_name: cachestream-streamer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STREAMER_PORT: 7789
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      # Audio FIFOs shared with the web container. Two pipes:
      #   - silence.fifo: always-on carrier (silent PCM)
      #   - music.fifo:   real music when a track is playing
      # The streamer amix-es both into the broadcast audio track.
      SILENCE_FIFO_PATH: /app/audio/silence.fifo
      MUSIC_FIFO_PATH:   /app/audio/music.fifo
    shm_size: "1gb"
    expose:
      - "7789"
    volumes:
      - cachestream-audio:/app/audio
      - ./media/vods:/app/media/vods:ro   # VODs to stream (read-only on this side)
    # On a Raspberry Pi, use `docker compose -f docker-compose.yml
    # -f docker-compose.pi.yml up -d` to pass /dev/video11 + GPU
    # access through so the h264_v4l2m2m hardware encoder works.
    # On non-Pi hosts you don't need any of that.
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7789/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------
  # nginx + nginx-rtmp ingest. Lets the operator push from OBS
  # (or any RTMP encoder) into CacheStream, which then forwards
  # the stream through its scene pipeline to Twitch.
  #
  # Push URL:    rtmp://<host-ip>:1935/live
  # Stream key:  whatever the operator sets via /admin (defaults
  #              to the literal "cache" so a fresh deploy works
  #              out of the box; can be locked down later).
  #
  # HLS playback (consumed by the headless Chromium scene):
  #   http://ingest:8080/hls/<key>.m3u8
  # ---------------------------------------------------------
  ingest:
    build:
      context: ./apps/ingest
      dockerfile: Dockerfile
    image: cachestream-ingest:latest
    container_name: cachestream-ingest
    restart: unless-stopped
    ports:
      - "${RTMP_PORT:-1935}:1935"   # OBS / encoder pushes here
    expose:
      - "8080"                      # HLS consumed internally by the streamer/web
    volumes:
      # v1.13.6: now mounts to our own image's nginx config path
      # rather than the path tiangolo/nginx-rtmp used. The custom
      # image installs nginx under /usr/local/nginx (not /etc/nginx)
      # so we can ship a vanilla mainline build + a known-good
      # nginx-rtmp-module version we control.
      - ./apps/ingest/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
      - cachestream-ingest-hls:/tmp/hls
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cachestream-data:
  cachestream-audio:
  cachestream-ingest-hls:
