# =========================================================
# Raspberry Pi 4 overlay — passes the kernel video devices
# into the streamer container so it can use the on-board
# h264_v4l2m2m hardware H.264 encoder.
#
# Pi 4 users:
#   docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d
#
# Or persist via shell:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.pi.yml
#   docker compose up -d
#
# Pi 5 users:
#   The BCM2712 has NO fixed-function H.264 encoder, so do NOT
#   map the /dev/video* encoder devices below (they don't exist
#   and Docker errors out). The streamer auto-detects Pi 5 and
#   applies a tuned libx264 profile (720p30 veryfast) for you.
#   BUT the Pi 5 DOES have a GPU for rendering — to fix choppy
#   ~3-fps scenes you still want the /dev/dri render node. Easiest:
#   create a tiny docker-compose.pi5.yml with just the streamer
#   `devices: [/dev/dri:/dev/dri]` + `group_add: [render]` blocks
#   from below (drop the /dev/video* lines), and run
#   `docker compose -f docker-compose.yml -f docker-compose.pi5.yml up -d`.
#
# ─────────────────────────────────────────────────────────
# Before using this file on Pi 4, check which video devices
# your Pi OS exposes:
#
#     ls /dev/video*
#
# On Raspberry Pi OS Bookworm / 64-bit (Pi 4):
#     /dev/video10  → decoder
#     /dev/video11  → H.264 encoder    ← this is the one we want
#     /dev/video12  → ISP
#
# On Bullseye and earlier the encoder may be at /dev/video1.
#
# If you see an error like:
#   "error gathering device information while adding custom
#    device /dev/video10: no such file or directory"
# …it means that device doesn't exist on your Pi. Either:
#   (a) load the kernel module (Bookworm / Pi 4):
#       echo 'dtoverlay=rpivid-v4l2' | sudo tee -a /boot/firmware/config.txt
#       sudo reboot
#   (b) edit the `devices:` block below to match your /dev/video*
#   (c) just don't use this overlay — the runtime fallback detects
#       HW encoder failure and falls back to libx264 automatically.
#       Performance is fine on a Pi 4 at 720p30 ultrafast.
# ─────────────────────────────────────────────────────────
services:
  streamer:
    devices:
      # Encoder. If your Pi OS has it at a different path,
      # adjust the LEFT side of the colon (host) only.
      - /dev/video11:/dev/video11
      # Decoder + ISP — useful for future HW decode / filter
      # work. Comment these out if your Pi only has video11.
      - /dev/video10:/dev/video10
      - /dev/video12:/dev/video12
      # GPU render node (VideoCore / V3D). Lets Chromium rasterise
      # scenes on the GPU instead of the slow CPU SwiftShader path
      # — this is what fixes the "~3 fps" choppy-scene problem.
      # It is SEPARATE from the v4l2 H.264 encoder above, so it
      # also helps the Pi 5 (which has a GPU for rendering but no
      # fixed-function H.264 encoder). Needs STREAM_CHROMIUM_GPU
      # to be `auto` (the default, auto-detects Pi) or `on`.
      - /dev/dri:/dev/dri
    # Some Pi OS installs gate the video devices behind the
    # `video` group and the GPU render node behind the `render`
    # group rather than world-rw. Adding the streamer user to both
    # (entrypoint runs as root briefly, so these supplementary
    # groups survive the setpriv drop) covers all layouts.
    group_add:
      - video
      - render
