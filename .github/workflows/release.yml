# =========================================================
# CacheStream release workflow
# =========================================================
# Builds multi-arch (amd64 + arm64) Docker images for all runtime
# services and pushes them to GitHub Container Registry.
#
# Triggers:
#   - tag push matching `v*` or `[0-9]*` -> tagged + latest + GitHub Release
#   - workflow_dispatch without version   -> manual-<sha> + latest Docker images
#   - workflow_dispatch with version      -> tagged + latest + GitHub Release
#
# Images:
#   ghcr.io/<owner>/cachestream-web:<version> + :latest
#   ghcr.io/<owner>/cachestream-streamer:<version> + :latest
#   ghcr.io/<owner>/cachestream-ingest:<version> + :latest
#
# The Pi 4 / Pi 5 / other ARM users get arm64; everyone else
# gets amd64 transparently via the multi-arch manifest. That's
# what makes the GHCR compose overlay work for both.
# =========================================================
name: release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version/tag to publish, for example 1.14.0 or v1.14.0"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      # Build all three images in parallel — they're independent.
      # v1.13.6 added cachestream-ingest (custom nginx-rtmp image)
      # so we own the version of the rtmp module + can bake the
      # CacheStream-specific defaults straight into the binary.
      matrix:
        include:
          - image: cachestream-web
            context: ./apps/web
          - image: cachestream-streamer
            context: ./apps/streamer
          - image: cachestream-ingest
            context: ./apps/ingest

    steps:
      - uses: actions/checkout@v4

      # QEMU emulates arm64 on the amd64 GitHub runner so we can
      # build the Pi-bound layer without a self-hosted Pi runner.
      # Slower than native — typically ~6-8 min for the streamer
      # image (Chromium install) — but it works on the free tier.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the version tag from the dispatch input or git tag.
      # Image tags strip a leading `v`, so `v1.6.0` becomes `1.6.0`.
      - id: meta
        name: Compute tags
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          IMAGE="${IMAGE,,}"   # lowercase — GHCR rejects mixed-case repo names
          if [[ -n "$DISPATCH_VERSION" ]]; then
            VERSION="${DISPATCH_VERSION#v}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            VERSION="manual-${GITHUB_SHA::7}"
            echo "tags=${IMAGE}:${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"     >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Buildx layer cache lives in the GHCR registry next to
          # the image — survives across runs without us managing a
          # separate cache bucket.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to:   type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
          # OCI annotations make the GitHub Packages UI show source
          # links + the release version automatically.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Summarize published image
        run: |
          echo "Published \`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: release_meta
        name: Compute release metadata
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ -n "$DISPATCH_VERSION" ]]; then
            TAG="$DISPATCH_VERSION"
            VERSION="${DISPATCH_VERSION#v}"
            SHOULD_RELEASE=true
          elif [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$REF_NAME"
            VERSION="${REF_NAME#v}"
            SHOULD_RELEASE=true
          else
            TAG=""
            VERSION="manual-${GITHUB_SHA::7}"
            SHOULD_RELEASE=false
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "should_release=${SHOULD_RELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Manual dispatch summary
        if: steps.release_meta.outputs.should_release != 'true'
        run: |
          echo "Docker images were published by the build jobs." >> "$GITHUB_STEP_SUMMARY"
          echo "Set the workflow dispatch version input, or push a version tag, to create a GitHub Release." >> "$GITHUB_STEP_SUMMARY"

      # Create a GitHub Release for the tag with the body taken
      # from CHANGELOG.md (if a matching `## X.Y.Z` section exists).
      - name: Extract release notes from CHANGELOG
        if: steps.release_meta.outputs.should_release == 'true'
        id: notes
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"
          if [[ -f CHANGELOG.md ]]; then
            # Grab from the heading of THIS version down to the next ## heading.
            awk -v v="$VERSION" '
              $0 ~ "^## "v"($| )"       { p=1; next }
              p && /^## [0-9]/          { exit }
              p                         { print }
            ' CHANGELOG.md > /tmp/notes.md
          fi
          if [[ ! -s /tmp/notes.md ]]; then
            echo "_No changelog entry — see commits._" > /tmp/notes.md
          fi
          {
            echo "version=${VERSION}"
            echo "notes<<EOF"
            cat /tmp/notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        if: steps.release_meta.outputs.should_release == 'true'
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name:     CacheStream ${{ steps.notes.outputs.version }}
          body:     ${{ steps.notes.outputs.notes }}
          target_commitish: ${{ github.sha }}
          draft:    false
          prerelease: false
